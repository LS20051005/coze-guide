<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>古建筑智能导游（官方版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:#f0f2f5;overflow:hidden}
#chat-bot{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%}
#chat-bot>div{width:100%!important;height:100%!important}
#loading{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0f2f5;color:#6b7280;font-size:15px;gap:12px;transition:opacity .4s}
#loading .sp{width:34px;height:34px;border:3px solid #dce7e0;border-top-color:#1e6f50;border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading .lt{font-weight:600;color:#1e6f50}
</style>
</head>
<body>
<div id="loading"><div class="sp"></div><div class="lt">正在加载对话…</div></div>
<div id="chat-bot"></div>
<script>
// ===== 按设备区分会话：每台设备记住自己的对话 ID，加载时只恢复本设备的记录 =====
(function(){
  var KEY='coze_dev_conv_v2';
  function getDev(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
  function setDev(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function captureId(url,body){
    var m=(url.match(/conversation_id=([^&]+)/)||[])[1];
    if(!m&&body&&typeof body==='string'){try{var j=JSON.parse(body);m=j&&j.conversation_id}catch(e){}}
    if(m&&m!==getDev())setDev(m);
  }
  function fakeList(dev){
    var obj=dev?{code:0,data:{items:[{id:dev,updated_at:'2099-01-01T00:00:00Z',created_at:'2099-01-01T00:00:00Z',last_read_at:'2099-01-01T00:00:00Z'}]}}:{code:0,data:{items:[]}};
    return new Response(JSON.stringify(obj),{status:200,headers:{'Content-Type':'application/json'}});
  }
  var _f=window.fetch;
  if(_f){window.fetch=function(i,o){
    var url=(typeof i==='string')?i:(i&&i.url)||'';
    try{
      if(url.indexOf('/v1/conversations')>-1&&(!o||!o.method||o.method==='GET'))return Promise.resolve(fakeList(getDev()));
      if(url.indexOf('conversation_id=')>-1)captureId(url,o&&o.body);
    }catch(e){}
    return _f.apply(this,arguments);
  };}
  try{
    if(window.XMLHttpRequest){
      var K=XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open=function(m,u){try{this.__gurl=String(u)}catch(e){}return K.apply(this,arguments)};
      var S=XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.send=function(body){
        try{
          var u=this.__gurl||'',self=this;
          if(u.indexOf('/v1/conversations')>-1&&!this.__gdone){
            this.__gdone=1;
            var resp=JSON.stringify((function(){var dev=getDev();return dev?{code:0,data:{items:[{id:dev,updated_at:'2099-01-01T00:00:00Z'}]}}:{code:0,data:{items:[]}}})());
            setTimeout(function(){
              try{
                Object.defineProperty(self,'status',{value:200,configurable:true});
                Object.defineProperty(self,'responseText',{value:resp,configurable:true});
                Object.defineProperty(self,'response',{value:resp,configurable:true});
                self.readyState=4;
                try{if(typeof self.onreadystatechange==='function')self.onreadystatechange()}catch(e){}
                try{if(typeof self.onload==='function')self.onload()}catch(e){}
              }catch(e){}
            },0);
            return;
          }
          if(u.indexOf('conversation_id=')>-1)captureId(u,'');
        }catch(e){}
        return S.apply(this,arguments);
      };
    }
  }catch(e){}
})();
var PAT='pat_aGCsh57A0WKryaYeEu1p0Ns3ksndNBFiFOj0bP08Lni6yu6CEzg2Z0dOantQAGkN',BOT='7688579753414492169';
function did(){var k='coze_uid_v2',v=null;try{v=localStorage.getItem(k)}catch(e){}if(!v){v=String(Date.now()).slice(-9)+String(Math.floor(Math.random()*1e6)).padStart(6,'0');try{localStorage.setItem(k,v)}catch(e){}}return v}
function showFail(msg){var l=document.getElementById('loading');if(l){l.style.display='flex';l.innerHTML='<div style="text-align:center;line-height:2;color:#b91c1c;font-size:14px;padding:0 20px">SDK 加载失败<br><span style="color:#6b7280;font-size:13px">'+msg+'</span></div>'}}
function initChat(){
  try{
    window.__CHAT_INIT=1;
    var uid=did();
    var sdk=new CozeWebSDK.WebChatClient({config:{bot_id:BOT},userInfo:{id:uid,nickname:'游客'},ui:{base:{lang:'zh-CN'},header:{isShow:true},footer:{isShow:false},asstBtn:{isNeed:false},chatBot:{el:document.getElementById('chat-bot'),title:'古建筑智能导游',uploadable:true,isNeedAudio:true,isNeedQuote:true,isNeedFunctionCallMessage:false}},auth:{type:'token',token:PAT,onRefreshToken:function(){return PAT}}});
    window.sdk=sdk;
    setTimeout(function(){try{sdk.showChatBot()}catch(e){}var l=document.getElementById('loading');if(l)l.style.display='none'},800);
  }catch(e){showFail('初始化异常')}
}
if(window.CozeWebSDK){
  initChat();
}else{
  var s=document.createElement('script');
  s.src='https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js';
  s.onload=function(){initChat()};
  s.onerror=function(){showFail('检查网络后刷新')};
  document.head.appendChild(s);
  setTimeout(function(){ if(!window.__CHAT_INIT){ showFail('加载超时，请检查网络后刷新'); } },8000);
}
</script>
</body>
</html>
