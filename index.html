<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>古建筑智能导游（官方版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:#f0f2f5;overflow:hidden}
#chat-bot{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%}
#chat-bot>div{width:100%!important;height:100%!important}
#loading{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0f2f5;color:#6b7280;font-size:15px;gap:12px;transition:opacity .4s}
#loading .sp{width:34px;height:34px;border:3px solid #dce7e0;border-top-color:#1e6f50;border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading .lt{font-weight:600;color:#1e6f50}
</style>
</head>
<body>
<div id="loading"><div class="sp"></div><div class="lt">正在加载对话…</div></div>
<div id="chat-bot"></div>
<script>
// ===== 按设备区分会话 v4（最小验证）：不拦截任何请求；仅监听捕获会话 ID，初始化时直连本设备会话 =====
(function(){
  var KEY='coze_dev_conv_v2';
  function setDev(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function watch(url){
    var m=(url.match(/conversation_id=([^&]+)/)||[])[1];
    var cur='';try{cur=localStorage.getItem(KEY)||''}catch(e){}
    if(/^\d{6,}$/.test(m||'')&&m!==cur)setDev(m);
  }
  var _f=window.fetch;
  if(_f){window.fetch=function(i,o){
    var url=(typeof i==='string')?i:(i&&i.url)||'';
    try{watch(url)}catch(e){}
    return _f.apply(this,arguments);
  };}
  try{
    if(window.XMLHttpRequest){
      var K=XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open=function(m,u){try{this.__gurl=String(u)}catch(e){}return K.apply(this,arguments)};
      var S=XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.send=function(body){try{watch(this.__gurl||'')}catch(e){}return S.apply(this,arguments)};
    }
  }catch(e){}
})();
var PAT='pat_aGCsh57A0WKryaYeEu1p0Ns3ksndNBFiFOj0bP08Lni6yu6CEzg2Z0dOantQAGkN',BOT='7688579753414492169';
function did(){var k='coze_uid_v2',v=null;try{v=localStorage.getItem(k)}catch(e){}if(!v){v=String(Date.now()).slice(-9)+String(Math.floor(Math.random()*1e6)).padStart(6,'0');try{localStorage.setItem(k,v)}catch(e){}}return v}
function showFail(msg){var l=document.getElementById('loading');if(l){l.style.display='flex';l.innerHTML='<div style="text-align:center;line-height:2;color:#b91c1c;font-size:14px;padding:0 20px">SDK 加载失败<br><span style="color:#6b7280;font-size:13px">'+msg+'</span></div>'}}
function ensureDev(cb){
  var dev='';try{dev=localStorage.getItem('coze_dev_conv_v2')||''}catch(e){}
  if(/^\d{6,}$/.test(dev)){cb(dev);return;}
  var done=false;
  function fin(id){if(done)return;done=true;cb(id);}
  setTimeout(function(){fin('')},4000);   // 4s 超时兜底：新建失败也不让页面卡 loading
  // 无记录 → 调 Coze API 新建会话（本设备专属），避免恢复别的设备的历史
  try{
    fetch('https://api.coze.cn/v1/conversation/create',{method:'POST',headers:{'Authorization':'Bearer '+PAT,'Content-Type':'application/json'},body:'{}'})
      .then(function(r){return r.json()})
      .then(function(j){
        var id=j&&j.data&&j.data.id||'';
        if(/^\d{6,}$/.test(id)){try{localStorage.setItem('coze_dev_conv_v2',id)}catch(e){}}
        fin(id);
      })
      .catch(function(){fin('')});
  }catch(e){fin('')}
}
function initChat(){
  try{
    window.__CHAT_INIT=1;
    var uid=did();
    ensureDev(function(dev){
      var _cfg={bot_id:BOT};
      if(/^\d{6,}$/.test(dev))_cfg.conversation_id=dev;   // 有本设备会话则直连
      var sdk=new CozeWebSDK.WebChatClient({config:_cfg,userInfo:{id:uid,nickname:'游客'},ui:{base:{lang:'zh-CN'},header:{isShow:true},footer:{isShow:false},asstBtn:{isNeed:false},chatBot:{el:document.getElementById('chat-bot'),title:'古建筑智能导游',uploadable:true,isNeedAudio:true,isNeedQuote:true,isNeedFunctionCallMessage:false}},auth:{type:'token',token:PAT,onRefreshToken:function(){return PAT}}});
      window.sdk=sdk;
      setTimeout(function(){try{sdk.showChatBot()}catch(e){}var l=document.getElementById('loading');if(l)l.style.display='none'},800);
    });
  }catch(e){showFail('初始化异常')}
}
if(window.CozeWebSDK){
  initChat();
}else{
  var s=document.createElement('script');
  s.src='https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js';
  s.onload=function(){initChat()};
  s.onerror=function(){showFail('检查网络后刷新')};
  document.head.appendChild(s);
  setTimeout(function(){ if(!window.__CHAT_INIT){ showFail('加载超时，请检查网络后刷新'); } },8000);
}
// ?devid=1 调试：页面左下角显示本设备会话 ID（判断是否成功区分设备）
if(location.search.indexOf('devid')>-1){
  setTimeout(function(){
    try{
      var d='';try{d=localStorage.getItem('coze_dev_conv_v2')||''}catch(e){}
      var box=document.createElement('div');
      box.style.cssText='position:fixed;left:6px;bottom:6px;z-index:999999;background:#111;color:#0f0;font:11px monospace;padding:4px 8px;border-radius:6px;white-space:pre';
      box.textContent='本设备会话ID: '+(d||'（空 → 新建未成功，会串台）');
      document.body.appendChild(box);
    }catch(e){}
  },3000);
}
</script>
</body>
</html>
