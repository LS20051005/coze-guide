<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>古建筑智能导游（官方版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:#f0f2f5;overflow:hidden}
#chat-bot{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%}
#chat-bot>div{width:100%!important;height:100%!important}
#loading{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0f2f5;color:#6b7280;font-size:15px;gap:12px;transition:opacity .4s}
#loading .sp{width:34px;height:34px;border:3px solid #dce7e0;border-top-color:#1e6f50;border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading .lt{font-weight:600;color:#1e6f50}

.sel-bar{position:fixed;top:0;left:0;right:0;z-index:9998;background:#1e6f50;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;height:46px;transform:translateY(-100%);transition:transform .25s;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sel-bar.on{transform:translateY(0)}
.sb{background:none;border:none;color:#fff;font-size:14px;font-weight:600;padding:7px 12px;border-radius:10px;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:4px;white-space:nowrap}
.sb:hover{background:rgba(255,255,255,.15)}
.sb:disabled{opacity:.4;cursor:not-allowed}
.sb.dg:hover{background:rgba(239,68,68,.3)}
.sb .bd{background:rgba(255,255,255,.25);border-radius:10px;padding:1px 7px;font-size:13px;font-weight:700;min-width:20px;text-align:center}

.tm{position:fixed;top:0;right:0;z-index:99999;display:flex;align-items:center;height:100%}
.tmb{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;border-radius:50%;transition:background .2s;position:relative;top:4px}
.tmb svg{width:20px;height:20px;stroke:rgba(0,0,0,.35);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.tmb:hover{background:rgba(0,0,0,.06)}
.tmb:hover svg{stroke:rgba(0,0,0,.6)}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.78);color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;z-index:99999;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.mda{animation:md .2s ease forwards}
@keyframes md{0%{opacity:1;max-height:600px;overflow:hidden}100%{opacity:0;max-height:0;margin:0;padding:0}}
</style>
</head>
<body>
<div id="loading"><div class="sp"></div><div class="lt">正在加载对话…</div></div>
<div id="chat-bot"></div>
<div class="tm" id="tm"><button class="tmb" id="bM"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.8" fill="currentColor" stroke="none"/></svg></button></div>
<div class="sel-bar" id="sb">
  <button class="sb" id="bX"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>取消</button>
  <div style="display:flex;gap:6px">
    <button class="sb" id="bA"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span id="lA">全选</span></button>
    <button class="sb dg" id="bD" disabled><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除<span class="bd" id="bN">0</span></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== 页面级错误捕获与状态条：任何 JS 错误都会显示在页面底部红条，无需打开控制台 =====
function dbg(m){
  try{
    var d=document.getElementById('dbgbar');
    if(!d){d=document.createElement('div');d.id='dbgbar';d.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#a00;color:#fff;font:11px/1.5 monospace;z-index:999999;padding:4px 8px;white-space:pre-wrap;max-height:30vh;overflow:auto';document.body.appendChild(d);}
    d.textContent=(d.textContent?d.textContent+'\n':'')+new Date().toTimeString().slice(0,8)+' | '+m;
  }catch(e){}
}
window.addEventListener('error',function(e){try{dbg('JS: '+(e.message||'error'))}catch(_){}});
window.addEventListener('unhandledrejection',function(e){try{dbg('PR: '+((e.reason&&e.reason.message)||'promise error'))}catch(_){}});
// 删除全部后的空会话拦截：URL 带 wipe=1 时，让 SDK 拿不到旧会话列表 → 强制新建空会话，历史永不回流
(function(){
  var _f=window.fetch;
  if(!_f) return;
  window.fetch=function(input,init){
    var url=(typeof input==='string')?input:(input&&input.url)||'';
    try{
      if(url.indexOf('api.coze.cn')>-1){
        try{window.__REQ2=(window.__REQ2||[]);window.__REQ2.push(((init&&init.method)||'GET')+' '+url.slice(0,100))}catch(e){}
        if(url.indexOf('conversation')>-1){
          dbg('SDK: '+((init&&init.method)||'GET')+' ...'+url.slice(-80));
        }
      }
      if(location.search.indexOf('wipe')>-1&&/\/v1\/conversations(\?|$)/.test(url)){
        dbg('拦截 /v1/conversations → 返回空列表（wipe 生效）');
        return Promise.resolve(new Response(JSON.stringify({code:0,data:{items:[]}}),{status:200,headers:{'Content-Type':'application/json'}}));
      }
    }catch(e){}
    return _f.apply(this,arguments);
  };
})();
// XHR 通道拦截（SDK 可能用 XMLHttpRequest 而非 fetch）：wipe 时伪造空会话列表响应
(function(){
  var O=window.XMLHttpRequest;
  if(!O) return;
  var K=O.prototype.open;
  O.prototype.open=function(m,u){try{this.__xurl=String(u)}catch(e){}return K.apply(this,arguments)};
  var S=O.prototype.send;
  O.prototype.send=function(){
    var self=this;
    try{
      var url=self.__xurl||'';
      if(location.search.indexOf('wipe')>-1&&/\/v1\/conversations(\?|$)/.test(url)){
        dbg('XHR拦截 /v1/conversations → 空列表（wipe 生效）');
        setTimeout(function(){
          try{
            var resp='{"code":0,"data":{"items":[]}}';
            Object.defineProperty(self,'status',{value:200,configurable:true});
            Object.defineProperty(self,'responseText',{value:resp,configurable:true});
            Object.defineProperty(self,'response',{value:resp,configurable:true});
            self.readyState=4;
            try{if(typeof self.onreadystatechange==='function')self.onreadystatechange()}catch(e){}
            try{if(typeof self.onload==='function')self.onload()}catch(e){}
            try{if(typeof self.onloadend==='function')self.onloadend()}catch(e){}
          }catch(e){dbg('XHR伪造失败: '+(e&&e.message?e.message:e))}
        },0);
        return;
      }
    }catch(e){}
    return S.apply(this,arguments);
  };
})();
if(location.search.indexOf('wipe')>-1){
  window.__REQ2=window.__REQ2||[];
  try{
    if(window.XMLHttpRequest){var _X2=window.XMLHttpRequest.prototype.open;window.XMLHttpRequest.prototype.open=function(m,u){try{window.__REQ2.push(m+' '+String(u).slice(0,100))}catch(e){}return _X2.apply(this,arguments)}}
  }catch(e){}
  setTimeout(function(){dbg('pagever: v13 | wipe 模式：本页会话列表已拦截，SDK 应新建空会话')},2000);
  setTimeout(function(){
    var n=0;try{n=document.querySelectorAll('.coze-chat-message-wrapper').length}catch(e){}
    dbg('wrapper总数: '+n+(n<=1?'（✅ 空会话，无历史）':'（⚠️ 仍有 '+n+' 条消息行）'));
    dbg('请求日志: '+(window.__REQ2&&window.__REQ2.length?window.__REQ2.join(' | '):'<无任何网络请求>'));
  },8000);
}
var PAT='pat_aGCsh57A0WKryaYeEu1p0Ns3ksndNBFiFOj0bP08Lni6yu6CEzg2Z0dOantQAGkN',BOT='7688579753414492169';
// 每次加载强制全新会话：清空本域一切存储（localStorage/sessionStorage/Cookie/IndexedDB）
try{localStorage.clear()}catch(e){}
try{sessionStorage.clear()}catch(e){}
try{
  var cs=document.cookie.split(';');
  for(var i=0;i<cs.length;i++){var nm=cs[i].split('=')[0];if(!nm)continue;document.cookie=nm.trim()+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';}
}catch(e){}
try{
  if(window.indexedDB&&indexedDB.databases){
    indexedDB.databases().then(function(dbs){for(var i=0;i<dbs.length;i++){try{indexedDB.deleteDatabase(dbs[i].name)}catch(e2){}}});
  }
}catch(e){}
function did(){var k='coze_uid_v2',v=null;try{v=localStorage.getItem(k)}catch(e){}if(!v){v=String(Date.now()).slice(-9)+String(Math.floor(Math.random()*1e6)).padStart(6,'0');try{localStorage.setItem(k,v)}catch(e){}}return v}
function showFail(msg){
  var l=document.getElementById('loading');
  if(l){l.style.display='flex';l.innerHTML='<div style="text-align:center;line-height:2;color:#b91c1c;font-size:14px;padding:0 20px">⚠️ SDK 加载失败<br><span style="color:#6b7280;font-size:13px">'+msg+'</span></div>'}
}
// loading 兜底：SDK 初始化后马上隐藏；5.5s 仍没初始化成功则提示（不再卡死）
setTimeout(function(){
  var l=document.getElementById('loading');
  if(l&&!window.__CHAT_INIT){ showFail('检查网络后刷新，若持续失败请稍后重试'); }
},5500);
function initChat(){
  try{
    window.__CHAT_INIT=1;
    var uid=did();
    var sdk=new CozeWebSDK.WebChatClient({config:{bot_id:BOT,isIframe:false},userInfo:{id:uid,nickname:'游客'},ui:{base:{lang:'zh-CN'},header:{isShow:true,isNeedClose:false},footer:{isShow:false},asstBtn:{isNeed:false},chatBot:{el:document.getElementById('chat-bot'),title:'古建筑智能导游',uploadable:true,isNeedAudio:true,isNeedQuote:true,isNeedFunctionCallMessage:false}},auth:{type:'token',token:PAT,onRefreshToken:function(){return PAT}}});
    window.sdk=sdk;
    setTimeout(function(){try{sdk.showChatBot()}catch(e){}var l=document.getElementById('loading');if(l)l.style.display='none'},800);
  }catch(e){
    console.error('[SDK初始化失败]',e);
    showFail('初始化异常：'+((e&&e.message)?e.message:'未知'));
  }
}
// SDK 动态加载：CDN 失败或超时不再卡死页面
if(window.CozeWebSDK){
  initChat();
}else{
  var s=document.createElement('script');
  s.src='https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js';
  s.onload=function(){initChat()};
  s.onerror=function(){showFail('检查网络后刷新')};
  document.head.appendChild(s);
  setTimeout(function(){ if(!window.__CHAT_INIT){ showFail('加载超时，请检查网络后刷新'); } },8000);
}

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},4000)}

var sm=false,selMap={},allOn=false,n=0,cbCount=0;
var eB=document.body,eT=document.getElementById('tm'),eS=document.getElementById('sb'),eM=document.getElementById('bM'),eX=document.getElementById('bX'),eA=document.getElementById('bA'),eD=document.getElementById('bD'),eL=document.getElementById('lA'),eN=document.getElementById('bN');
var rows=[];
var CK='<svg viewBox="0 0 24 24" width="12" height="12" stroke="#fff" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="opacity:0;transition:opacity .12s"><polyline points="20 6 9 17 4 12"/></svg>';
var XX='<svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

// 调试信息
function debugInfo(){
  var root=document.getElementById('chat-bot');
  if(!root) return 'root不存在';
  var info=[];
  info.push('root子元素:'+root.children.length);
  var all=root.querySelectorAll('*');
  info.push('总元素:'+all.length);
  var divs=root.querySelectorAll('div');
  info.push('div:'+divs.length);
  var imgs=root.querySelectorAll('img');
  info.push('img:'+imgs.length);
  var wrappers=root.querySelectorAll('.coze-chat-message-wrapper');
  info.push('wrapper:'+wrappers.length);
  // 找可滚动容器
  var scrollCount=0;
  for(var i=0;i<divs.length;i++){
    var st=window.getComputedStyle(divs[i]);
    if(st.overflowY==='auto'||st.overflowY==='scroll') scrollCount++;
  }
  info.push('scroll:'+scrollCount);
  return info.join(' | ');
}

function isVis(el){
  if(!el||!el.getClientRects) return false;
  try{ if(el.getClientRects().length===0) return false; }catch(e){ return false; }
  return true;
}

function avatarRows(){
  // 头像签名定位（兜底）：气泡消息头像可以是 <img> 或背景图 div（18-72px），向上取“消息行”容器
  var root=document.getElementById('chat-bot');
  if(!root) return [];
  var cands=[];
  try{
    var imgs=root.querySelectorAll('img');
    for(var m=0;m<imgs.length;m++){
      var im=imgs[m];
      if(!isVis(im)) continue;
      var iw=im.offsetWidth,ih=im.offsetHeight;
      if(iw>=18&&iw<=72&&ih>=18&&ih<=72) cands.push(im);
    }
  }catch(e){}
  var divs=root.querySelectorAll('div');
  for(var i=0;i<divs.length;i++){
    var d=divs[i];
    if(!isVis(d)) continue;
    var w=d.offsetWidth,h=d.offsetHeight;
    if(w<18||w>72||h<18||h>72) continue;
    var bg='';
    try{bg=d.style.backgroundImage||window.getComputedStyle(d).backgroundImage||''}catch(e){bg=''}
    if(bg&&bg!=='none'&&bg!=='initial') cands.push(d);
  }
  var out=[],seen={};
  for(var c=0;c<cands.length;c++){
    var d=cands[c];
    var p=d.parentElement,row=null;
    for(var k=0;p&&k<4;k++){
      if(p===root) break;
      if(p.querySelector('textarea,input')||p.querySelector('[contenteditable="true"],[contenteditable=""]')){p=p.parentElement;continue;}
      if(p.offsetWidth>150&&isVis(p)){row=p;break;}
      p=p.parentElement;
    }
    if(!row||row._avTag) continue;
    var rt=(row.textContent||'').trim();
    if(rt.length===0&&!row.querySelector('img')) continue;
    if(row.offsetHeight<30) continue;
    if(seen[row]) continue;
    seen[row]=true;
    row._uid='u'+(++n);
    out.push(row);
  }
  return out;
}

function findMessages(){
  var root=document.getElementById('chat-bot');
  if(!root) return [];
  var found=[];
  // 首选（报告实测最准）: SDK 官方消息行 .coze-chat-message-wrapper —— 每条消息一行
  // 开场白/欢迎语也带该类且位于最顶部(y 最小)，跳过它，其余均为可删除的对话消息
  var wrappers=root.querySelectorAll('.coze-chat-message-wrapper');
  var rows=[];
  for(var i=0;i<wrappers.length;i++){
    var el=wrappers[i];
    if(!isVis(el)) continue;
    if(el.querySelector('textarea,input')) continue;
    if(el.querySelector('[contenteditable="true"],[contenteditable=""]')) continue;
    rows.push(el);
  }
  if(rows.length>0){
    rows.sort(function(a,b){var ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();return (ra.top||0)-(rb.top||0)});
    for(var k=0;k<rows.length;k++){
      if(k===0) continue;               // 跳过最顶部1条：开场白/欢迎语（不参与删除）
      if(rows[k]._avTag) continue;
      rows[k]._uid='u'+(++n);
      found.push(rows[k]);
    }
    if(found.length>0) return found;
    return [];                          // 只有开场白而无对话 → 无可删消息
  }
  // 兜底: 头像签名（img 或背景图）
  var av=avatarRows();
  if(av.length>0) return av;
  return [];
}

function addCB(row){
  row._avTag=true;
  var cb=document.createElement('div');
  cb.className='cb';
  cb.style.cssText='display:inline-flex;width:20px;height:20px;border-radius:50%;border:2px solid #bbb;background:#fff;align-items:center;justify-content:center;cursor:pointer;vertical-align:middle;margin-right:6px;flex-shrink:0;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.1);position:relative;top:2px;z-index:2';
  cb.innerHTML=CK;
  cb._msgRow=row;
  var del=document.createElement('button');
  del.className='cb-del';
  del.style.cssText='display:inline-flex;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.06);color:rgba(0,0,0,.35);align-items:center;justify-content:center;cursor:pointer;vertical-align:middle;margin-right:6px;flex-shrink:0;transition:all .15s;opacity:.5;position:relative;top:2px;z-index:2';
  del.innerHTML=XX;
  del._msgRow=row;
  del.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();if(sm)return;var r=del._msgRow;if(r){r.classList.add('mda');setTimeout(function(){if(r)r.style.display='none'},200)}});
  // 勾选框插在消息行最前面（头像/气泡前），顺序: 勾选框 → 删除按钮 → 消息内容
  row.insertBefore(del,row.firstChild);
  row.insertBefore(cb,row.firstChild);
  return {cb:cb,del:del,msgRow:row};
}

function inject(){
  if(sm&&Object.keys(selMap).length>0) return cbCount;
  document.querySelectorAll('.cb,.cb-del').forEach(function(e){e.remove()});
  for(var i=0;i<rows.length;i++){if(rows[i]&&rows[i].msgRow)rows[i].msgRow._avTag=false}
  rows=[];
  selMap={};cbCount=0;n=0;allOn=false;
  var msgs=findMessages();
  msgs.forEach(function(row){
    n++;
    var r=addCB(row);
    if(r){r.cb.setAttribute('data-cb','cb'+n);r.del.setAttribute('data-cb','del'+n);cbCount++;rows.push(r)}
  });
  return msgs.length;
}

function removeCB(){
  document.querySelectorAll('.cb,.cb-del').forEach(function(e){e.remove()});
  for(var i=0;i<rows.length;i++){if(rows[i]&&rows[i].msgRow)rows[i].msgRow._avTag=false}
  rows=[];
  selMap={};cbCount=0;allOn=false;
}

document.addEventListener('click',function(e){
  if(!sm) return;
  var cb=e.target.closest('.cb');
  if(!cb) return;
  e.stopPropagation();e.preventDefault();
  var id=cb.getAttribute('data-cb');
  if(!id) return;
  if(cb.classList.contains('on')){
    cb.classList.remove('on');
    cb.querySelector('svg').style.opacity='0';
    delete selMap[id];
  } else {
    cb.classList.add('on');
    cb.style.background='#1e6f50';
    cb.style.borderColor='#1e6f50';
    cb.querySelector('svg').style.opacity='1';
    selMap[id]=true;
  }
  upd();
},true);

function upd(){
  var cnt=Object.keys(selMap).length;
  eN.textContent=cnt;
  eD.disabled=(cnt===0);
  allOn=(cbCount>0&&cnt===cbCount);
  eL.textContent=allOn?'取消全选':'全选';
}

eA.addEventListener('click',function(){
  var cbs=document.querySelectorAll('.cb');
  if(cbs.length===0){toast('未找到消息');return}
  if(allOn){
    cbs.forEach(function(cb){cb.classList.remove('on');cb.style.background='';cb.style.borderColor='';cb.querySelector('svg').style.opacity='0';var id=cb.getAttribute('data-cb');if(id)delete selMap[id]});
  } else {
    cbs.forEach(function(cb){cb.classList.add('on');cb.style.background='#1e6f50';cb.style.borderColor='#1e6f50';cb.querySelector('svg').style.opacity='1';var id=cb.getAttribute('data-cb');if(id)selMap[id]=true});
  }
  upd();
});

eD.addEventListener('click',function(){
  var ids=Object.keys(selMap);
  if(ids.length===0) return;
  var isAll=(cbCount>0&&ids.length>=cbCount);
  ids.forEach(function(id){
    var cb=document.querySelector('[data-cb="'+id+'"]');
    if(cb&&cb._msgRow){cb._msgRow.classList.add('mda');setTimeout(function(){if(cb._msgRow)cb._msgRow.style.display='none'},200)}
  });
  if(isAll){
    toast('已清空全部对话，正在重置会话…');
    setTimeout(hardReset,300);
  }else{
    toast('已删除 '+ids.length+' 条');
    setTimeout(exit,350);
  }
});

function enter(){
  try{
    var cnt=inject();
    if(cnt===0){toast('未找到消息\n'+debugInfo());return}
    sm=true;
    eB.classList.add('sm');
    eS.classList.add('on');
    eT.style.display='none';
    toast('已识别 '+cnt+' 条消息，点头像旁圆圈勾选');
  }catch(err){
    toast('进入选择模式出错: '+(err&&err.message?err.message:err));
    try{console.error('[选择模式]',err)}catch(e2){}
  }
}
function exit(){
  sm=false;
  eB.classList.remove('sm');
  eS.classList.remove('on');
  eT.style.display='flex';
  removeCB();
}

// 清空 Coze SDK 在本地的全部会话/用户缓存（localStorage/sessionStorage/Cookie/IndexedDB，删掉即强制新会话）
function clearCozeCache(){
  try{localStorage.clear()}catch(e){}
  try{sessionStorage.clear()}catch(e){}
  try{
    var cs=document.cookie.split(';');
    for(var i=0;i<cs.length;i++){
      var nm=cs[i].split('=')[0];
      if(!nm)continue;
      document.cookie=nm.trim()+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
    }
  }catch(e){}
  try{
    if(window.indexedDB&&indexedDB.databases){
      indexedDB.databases().then(function(dbs){
        for(var i=0;i<dbs.length;i++){try{indexedDB.deleteDatabase(dbs[i].name)}catch(e2){}}
      });
    }
  }catch(e){}
}
// 删除全部：清本地凭据 + 带 wipe=1 同页刷新（加载时拦截 SDK 会话列表）→ 全新空会话，历史永不回流
function hardReset(){
  clearCozeCache();
  toast('已清空全部对话，正在进入全新会话…');
  dbg('hardReset: 跳转 '+(location.pathname+'?wipe=1'));
  setTimeout(function(){location.replace(location.pathname+'?wipe=1')},250);
}
setTimeout(function(){
  // 按钮容器加 pointer-events:auto 防被 SDK 覆盖
  var tm=document.getElementById('tm');
  if(tm){tm.style.pointerEvents='auto';tm.style.zIndex='99999'}
  
  eM.addEventListener('mousedown',function(e){e.preventDefault();e.stopPropagation();enter()});
  eM.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();enter()},{passive:false});
  eX.addEventListener('click',exit);
  
  // 备用：document 级别点击检测右上角区域
  document.addEventListener('mousedown',function(e){
    if(e.target.closest('#bM')||e.target.closest('#tm')) return;
    if(e.clientX>window.innerWidth-60&&e.clientY<60){enter()}
  },true);
  
  // 备用：双击进入
  document.addEventListener('dblclick',function(e){
    if(sm) return;
    if(e.target.closest('.cb')||e.target.closest('.cb-del')) return;
    enter();
  });
},2000);

var th=false;
function watch(){
  var root=document.getElementById('chat-bot');
  if(!root) return;
  new MutationObserver(function(){
    if(th) return;th=true;
    setTimeout(function(){
      th=false;
      if(sm){
        var msgs=findMessages();
        msgs.forEach(function(row){
          if(row._avTag) return;
          n++;
          var r=addCB(row);
          if(r){r.cb.setAttribute('data-cb','cb'+n);r.del.setAttribute('data-cb','del'+n);cbCount++;rows.push(r)}
        });
        upd();
      }
    },300);
  }).observe(root,{childList:true,subtree:true});
}
setTimeout(watch,2000);

setTimeout(function(){
  if(typeof CozeWebSDK==='undefined'||!window.CozeWebSDK){
    document.getElementById('loading').innerHTML='<div style="text-align:center;line-height:2;color:#b91c1c;font-size:14px;padding:0 20px">⚠️ SDK 加载失败<br><span style="color:#6b7280;font-size:13px">检查网络后刷新</span></div>';
  }
},6000);

// ===== 诊断模式（可选）：URL 带 ?selftest=1 时，把候选行报告渲染到页面底部，无需打开控制台 =====
if(location.search.indexOf('selftest=1')>-1){
  setTimeout(function(){
    try{
      var root=document.getElementById('chat-bot');
      var lines=[];
      if(root){
        var divs=root.querySelectorAll('div');
        for(var i=0;i<divs.length;i++){
          var d=divs[i];
          var w=d.offsetWidth,h=d.offsetHeight;
          if(w<60||h<20) continue;
          var bg='';try{bg=d.style.backgroundImage||window.getComputedStyle(d).backgroundImage||''}catch(e){}
          var t=(d.textContent||'').replace(/\s+/g,' ').trim().slice(0,18);
          var r=d.getBoundingClientRect();
          var cls=(' '+d.className+' ');
          lines.push('['+i+'] '+String(d.className||'').slice(0,55)+' | '+w+'x'+h+' | y='+Math.round(r.top)+' | img='+d.querySelectorAll('img').length+' | bg='+((bg&&bg!=='none')?1:0)+' | wrapper='+(cls.indexOf('coze-chat-message-wrapper')>-1?1:0)+' | "'+t+'"');
        }
      }
      var lab=document.createElement('div');
      lab.id='diag';
      lab.style.cssText='position:fixed;left:0;right:0;top:10px;max-height:42vh;overflow:auto;background:#111;color:#0f8;font:11px/1.4 monospace;z-index:99999;padding:8px;white-space:pre;border-bottom:2px solid #0f8';
      lab.textContent='=== 候选行报告('+lines.length+') ===\n'+lines.join('\n');
      document.body.appendChild(lab);
    }catch(e){
      var lab=document.createElement('div');
      lab.id='diag';
      lab.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#a00;color:#fff;z-index:99999;padding:6px;font:12px monospace';
      lab.textContent='[selftest] 生成报告出错: '+e.message;
      document.body.appendChild(lab);
    }
  },7000);
}

// ===== 诊断模式 ?selftest=3：输出页面加载清空存储后 8 秒的键值，精确定位 SDK 的会话ID存储位置 =====
if(location.search.indexOf('selftest=3')>-1){
  setTimeout(function(){
    try{
      var o={},s={};
      try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);o[k]=(localStorage.getItem(k)||'').slice(0,120)}}catch(e){}
      try{for(var j=0;j<sessionStorage.length;j++){var k2=sessionStorage.key(j);s[k2]=(sessionStorage.getItem(k2)||'').slice(0,120)}}catch(e){}
      var lab=document.createElement('pre');
      lab.id='diag3';
      lab.style.cssText='position:fixed;left:0;right:0;top:0;max-height:45vh;overflow:auto;background:#000;color:#ff0;font:11px/1.4 monospace;z-index:999999;padding:8px;white-space:pre;border-bottom:2px solid #ff0';
      lab.textContent='=== 8秒后 localStorage ===\n'+JSON.stringify(o,null,1)+'\n=== 8秒后 sessionStorage ===\n'+JSON.stringify(s,null,1);
      document.body.appendChild(lab);
    }catch(e){}
  },8000);
}

// ===== 诊断模式 ?selftest=5：判别“历史恢复”来自本地还是服务端（增加会话ID/用户ID抓取）=====
if(location.search.indexOf('selftest=5')>-1){
  (function(){
    var _f=window.fetch;
    if(_f){
      window.fetch=function(input,init){
        try{
          var url=(typeof input==='string')?input:(input&&input.url)||'';
          if(url.indexOf('/v3/chat')>-1){
            var body=(init&&init.body)||'';
            if(typeof body==='string'&&body){
              try{
                var j=JSON.parse(body);
                if(j.conversation_id)window.__CONV_ID=j.conversation_id;
                if(j.user_id)window.__USR_ID=j.user_id;
              }catch(e){}
            }
          }
        }catch(e){}
        return _f.apply(this,arguments);
      };
    }
  })();
  setTimeout(function(){
    try{
      var info='';
      try{
        var raw=localStorage.getItem('SLARDARbot_studio_sdk')||'';
        info=(raw?decodeURIComponent(escape(atob(raw))):'（无SDK键）');
      }catch(e){info='解码失败: '+e.message}
      var ws=document.querySelectorAll('.coze-chat-message-wrapper');
      var firstTxt='';
      if(ws.length>1){try{firstTxt=(ws[1].textContent||'').trim().replace(/\s+/g,' ').slice(0,40)}catch(e){}}
      var lab=document.createElement('pre');
      lab.id='diag5';
      lab.style.cssText='position:fixed;left:10px;top:10px;max-width:70vw;background:#000;color:#0ff;font:12px/1.5 monospace;z-index:999999;padding:10px;white-space:pre;border:2px solid #0ff';
      lab.textContent='SDK身份键(解码): '+info+'\n首次chat请求 conversation_id: '+(window.__CONV_ID||'未捕获')+'\n请求 user_id: '+(window.__USR_ID||'未捕获')+'\nwrapper总数: '+ws.length+'\n第一条消息: "'+firstTxt+'"\n\n【判读】无痕窗口打开本页：\n· 若第一条消息仍是历史内容（如“用户上传大同古建筑图…”）→ 历史由服务端按 PAT 恢复，需 API 删会话；\n· 若只有开场白（“您好，我是智能古建筑导游助手”）→ 本地恢复，当前版本已修复。\n· conversation_id / user_id 是否与上次相同，可进一步佐证恢复源。\n请把整块内容复制发我。';
      document.body.appendChild(lab);
    }catch(e){}
  },9000);
}

// ===== 诊断模式 ?selftest=6：探测 Coze 会话管理 API（拿会话ID+试删），并抓取 SDK 网络请求 =====
if(location.search.indexOf('selftest=6')>-1){
  try{
    var _f=window.fetch;
    if(_f){window.fetch=function(i,o){try{var u=(typeof i==='string')?i:(i&&i.url)||'';if(u.indexOf('api.coze.cn')>-1){var b=(o&&o.body)||'';window.__REQ=(window.__REQ||[]);window.__REQ.push(((o&&o.method)||'GET')+' '+u.slice(0,130)+(typeof b==='string'&&b?(' :: '+b.slice(0,220)):''))}}catch(e){}return _f.apply(this,arguments)}}
    if(window.XMLHttpRequest){var _X=window.XMLHttpRequest.prototype.open;window.XMLHttpRequest.prototype.open=function(m,u){try{window.__REQ=(window.__REQ||[]);window.__REQ.push(m+' '+String(u).slice(0,130))}catch(e){}return _X.apply(this,arguments)}}
  }catch(e){}
  setTimeout(function(){
    var out=['=== SDK 请求日志 ===\n'+((window.__REQ&&window.__REQ.join('\n'))||'（未捕获到 api.coze.cn 请求，SDK 可能走了别的通道）')];
    function showOut(){var lab=document.createElement('pre');lab.style.cssText='position:fixed;left:0;right:0;top:10px;max-height:48vh;overflow:auto;background:#001;color:#0ff;font:11px/1.4 monospace;z-index:999999;padding:8px;white-space:pre;border-bottom:2px solid #0ff';lab.textContent=out.join('\n');document.body.appendChild(lab)}
    fetch('https://api.coze.cn/v3/conversations?bot_id='+BOT,{headers:{'Authorization':'Bearer '+PAT}})
      .then(function(r){return r.json()})
      .then(function(j){
        out.push('\n=== GET /v3/conversations 返回 ===\n'+JSON.stringify(j).slice(0,900));
        var items=j&&j.data&&j.data.items;
        if(Array.isArray(items)&&items.length>0){
          var id=items[0].id;
          out.push('\n最近会话ID: '+id);
          return fetch('https://api.coze.cn/v3/conversations/'+encodeURIComponent(id),{method:'DELETE',headers:{'Authorization':'Bearer '+PAT}})
            .then(function(r){return r.json()})
            .then(function(d){out.push('\n=== DELETE /v3/conversations/{id} 结果 ===\n'+JSON.stringify(d).slice(0,400));showOut(out)});
        }
        showOut(out);
      })
      .catch(function(e){out.push('\nAPI 请求失败: '+(e&&e.message?e.message:e));showOut(out)});
  },12000);
}
</script>
