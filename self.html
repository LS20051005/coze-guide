<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>古建筑智能导游（自研版·按设备区分）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f4f7;color:#1f2937}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;background:#f7f9fb}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#1e6f50;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bot-name{font-size:20px;font-weight:700}
.bot-tag{font-size:12px;opacity:.85;margin-top:2px}
.messages{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;max-width:88%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.assistant{align-self:flex-start;align-items:flex-start}
.bubble{padding:12px 16px;border-radius:16px;font-size:17px;line-height:1.8;word-break:break-word;overflow-wrap:anywhere}
.msg.user .bubble{background:#1e6f50;color:#fff;border-bottom-right-radius:6px}
.msg.assistant .bubble{background:#fff;border:1px solid #e3e8ee;border-bottom-left-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.bubble img{max-width:100%;border-radius:10px;margin:6px 0;display:block;cursor:pointer}
.bubble p{margin:6px 0}
.bubble p:first-child{margin-top:0}.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{margin:10px 0 6px;color:#1e6f50;line-height:1.5}
.bubble ul,.bubble ol{margin:6px 0 6px 24px}.bubble li{margin:4px 0}
.bubble code{background:#eef1f5;padding:1px 6px;border-radius:5px;font-size:15px}
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing span{width:8px;height:8px;background:#9ca3af;border-radius:50%;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.input-bar{display:flex;align-items:center;gap:8px;padding:10px 12px 14px;border-top:2px solid #e0e6ec;background:#fff;flex-shrink:0}
.btn-upload{display:flex;align-items:center;gap:5px;background:#fff;border:2px solid #1e6f50;color:#1e6f50;border-radius:12px;padding:10px 12px;cursor:pointer;flex-shrink:0;font-size:15px;font-weight:700}
.btn-upload:active{background:#e8f3ec}
.btn-clear{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);color:#fff;border-radius:12px;padding:9px 14px;font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0}
.btn-clear:hover{background:rgba(255,255,255,.35)}
.mic-inline{background:#e8f3ec;border:none;color:#1e6f50;cursor:pointer;width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;margin-right:2px}
.mic-inline.mic-on{background:#1e6f50;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.del-btn{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(255,255,255,.9);color:#999;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:5}
.msg:hover .del-btn{display:flex}
.del-btn:hover{background:#fee2e2;color:#dc2626}
.rd-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid #1e6f50;background:#fff;color:#1e6f50;font-size:12px;cursor:pointer;margin-left:6px;flex-shrink:0}
.rd-btn.rd-on{background:#1e6f50;color:#fff}
.msg{position:relative}
.msg-cb{display:none;width:20px;height:20px;border-radius:50%;border:2px solid #bbb;background:#fff;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;cursor:pointer;position:relative;top:2px;z-index:2}
.msg-cb.on{background:#1e6f50;border-color:#1e6f50}
.messages.sel .msg-cb{display:inline-flex}
.sel-toolbar{position:fixed;top:0;left:0;right:0;z-index:9998;background:#1e6f50;color:#fff;display:none;align-items:center;justify-content:space-between;padding:0 10px;height:44px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sb2{background:none;border:none;color:#fff;font-size:14px;font-weight:600;padding:7px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.sb2:hover{background:rgba(255,255,255,.15)}
.sb2.dg:hover{background:rgba(239,68,68,.35)}
.ops{display:flex;gap:6px;margin-top:4px}
.op-btn{background:#fff;border:1px solid #d1d5db;color:#374151;border-radius:10px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.op-btn:hover{border-color:#1e6f50;color:#1e6f50}
.op-btn.rd-on{background:#1e6f50;color:#fff;border-color:#1e6f50}
.op-del{display:none}
.messages.sel .op-del{display:inline-block}
.op-del:hover{border-color:#dc2626;color:#dc2626}
.input-wrap{flex:1;border:2px solid #c9d2dc;border-radius:14px;background:#f7f9fb;padding:6px 12px;display:flex;align-items:center}
.input-wrap:focus-within{border-color:#1e6f50}
#inputText{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:18px;font-family:inherit;resize:none;max-height:110px;line-height:1.6}
.btn-send{background:#1e6f50;color:#fff;border:none;border-radius:14px;padding:13px 18px;font-size:18px;font-weight:700;cursor:pointer;flex-shrink:0}
.btn-send:disabled{opacity:.45;cursor:not-allowed}
.img-preview{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;padding:20px}
#imgPreview[hidden]{display:none!important}
.img-preview img{max-width:92%;max-height:60%;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.4)}
.preview-actions{display:flex;gap:14px}
.btn{border:none;border-radius:12px;padding:13px 22px;font-size:18px;font-weight:700;cursor:pointer}
.btn-primary{background:#1e6f50;color:#fff}
.btn-danger{background:#e5e7eb;color:#374151}
.tip{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:7px 14px;border-radius:9px;font-size:13px;z-index:99;display:none}
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <div>
      <div class="bot-name">古建筑智能导游</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-clear" id="btnVoice" title="选择朗读音色">🔊 音色</button>
      <button class="btn-clear" id="btnDel" title="删除对话（长按气泡也可进入）">🗑 删除</button>
    </div>
  </header>
  <main id="msgs" class="messages"></main>
  <footer class="input-bar">
    <label class="btn-upload" for="fileInput"><span>📷</span><span>照片</span></label>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <div class="input-wrap">
      <button class="mic-inline" id="btnMic" title="语音输入"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
      <textarea id="inputText" rows="1" placeholder="打字提问…（可带照片）"></textarea>
    </div>
    <button class="btn-send" id="btnSend">发送</button>
  </footer>
</div>
<div id="imgPreview" class="img-preview" hidden>
  <img id="previewImg" alt="预览">
  <div class="preview-actions"><button id="previewRemove" class="btn btn-danger">✕ 移除</button><button id="previewConfirm" class="btn btn-primary">✓ 就用这张</button></div>
</div>
<div class="sel-toolbar" id="selToolbar">
  <button id="btnSelCancel" class="sb2">取消</button>
  <button id="btnSelAll" class="sb2">全选</button>
  <button id="btnSelRm" class="sb2 dg">删除(<span id="selN">0</span>)</button>
  <button id="btnSelClearAll" class="sb2 dg">全部清除</button>
</div>
<div class="tip" id="tip"></div>
<script>
'use strict';
var PAT='pat_aGCsh57A0WKryaYeEu1p0Ns3ksndNBFiFOj0bP08Lni6yu6CEzg2Z0dOantQAGkN',BOT='7688579753414492169';
var BASE='https://api.coze.cn';
var KEY='coze_conv_v2';                 // 本设备专属会话 ID（各设备互不共享）
var msgs=document.getElementById('msgs'),input=document.getElementById('inputText'),sendBtn=document.getElementById('btnSend'),tip=document.getElementById('tip');
var elFile=document.getElementById('fileInput'),elPreview=document.getElementById('imgPreview'),elPrevImg=document.getElementById('previewImg');
var btnMic=document.getElementById('btnMic'),btnDel=document.getElementById('btnDel'),btnVoice=document.getElementById('btnVoice');
var elPrevRemove=document.getElementById('previewRemove'),elPrevConfirm=document.getElementById('previewConfirm');
var sending=false;
var pendingImg=null,pendingMime=null,pendingImgSmall='';   // 待发送图片（原图base64 / mime / 压缩缓存图）

function toast(t){tip.textContent=t;tip.style.display='block';clearTimeout(tip._t);tip._t=setTimeout(function(){tip.style.display='none'},3000)}
function getConv(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
function setConv(v){try{localStorage.setItem(KEY,v)}catch(e){}}
// 本设备本地历史（兜底：保证完整讲解与标注图刷新后不丢）
var HIST='coze_hist_v2';
function histGet(){try{return JSON.parse(localStorage.getItem(HIST)||'[]')}catch(e){return []}}
function histPush(it){var a=histGet();a.push(it);if(a.length>40)a=a.slice(-40);try{localStorage.setItem(HIST,JSON.stringify(a))}catch(e){}}
function extractReply(reply){
  var text='',img='',c=reply;
  if(typeof c==='string'){try{c=JSON.parse(c)}catch(e){}}
  if(Array.isArray(c)){c.forEach(function(p){if(p.type==='text')text+=(text?'\n':'')+(p.text||'');if(p.type==='image'&&p.file_url)img=p.file_url;});}
  else text=String(c||'');
  return {text:text,img:img};
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function did(){var k='coze_uid_v2',v=null;try{v=localStorage.getItem(k)}catch(e){}if(!v){v=String(Date.now()).slice(-9)+String(Math.floor(Math.random()*1e6)).padStart(6,'0');try{localStorage.setItem(k,v)}catch(e){}}return v}

function md(s){
  s=esc(s);
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  s=s.replace(/^#{3,6}\s+(.*)$/gm,'<h4>$1</h4>');
  s=s.replace(/^##\s+(.*)$/gm,'<h3>$1</h3>');
  s=s.replace(/^#\s+(.*)$/gm,'<h2>$1</h2>');
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/^\s*[-*+]\s+(.*)$/gm,'<li>$1</li>');
  s=s.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
  s=s.replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
  s=s.replace(/^(?!<(p|ul|li|h[1-4]|pre|img|br|a|strong|em))(.+)$/gm,'<p>$2</p>');
  s=s.replace(/<p>(<br>)+/g,'<p>');
  return s;
}

function addMsg(role,html,histId){
  var w=document.createElement('div');w.className='msg '+role;
  if(histId)w.setAttribute('data-hist',histId);
  var cb=document.createElement('div');cb.className='msg-cb';cb.textContent='✓';
  if(histId)cb.setAttribute('data-hist',histId);
  var b=document.createElement('div');b.className='bubble';b.innerHTML=html;
  var ops=document.createElement('div');ops.className='ops';
  if(role==='assistant'){
    var rd=document.createElement('button');rd.className='op-btn';rd.textContent='🔊 朗读';rd.title='朗读（支持断点续播）';
    rd.addEventListener('click',function(){rdClick(rd,b)});
    ops.appendChild(rd);
  }
  var del=document.createElement('button');del.className='op-btn op-del';del.textContent='✕ 删除';del.title='删除此条';
  del.addEventListener('click',function(){w.remove();if(histId)histDel(histId);});
  ops.appendChild(cb);   // 勾选框排在气泡下方操作行（与朗读并排）
  ops.appendChild(del);
  w.appendChild(b);w.appendChild(ops);
  msgs.appendChild(w);msgs.scrollTop=msgs.scrollHeight;
}
// 朗读：断点续播 + 音色可选
var RD={state:'idle',blocks:[],idx:0,btn:null};
var VOICE_KEY='coze_voice_v2';
function splitSent(t){
  var out=[],cur='';
  for(var i=0;i<t.length;i++){var ch=t.charAt(i);cur+=ch;if('。！？；：\n'.indexOf(ch)>-1){var p=cur.trim();if(p)out.push(p);cur='';}}
  var p=cur.trim();if(p)out.push(p);
  if(!out.length&&t.trim())out=[t.trim()];
  return out;
}
function pickVoice(){
  try{
    var vs=window.speechSynthesis.getVoices();
    if(!vs||!vs.length)return null;
    var zh=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf('zh')===0});
    var name='';try{name=localStorage.getItem(VOICE_KEY)||''}catch(e){}
    if(name){for(var i=0;i<zh.length;i++){if(zh[i].name===name)return zh[i];}}
    var order=['xiaoxiao','xiaoyi','xiaohan','yunxi','yunyang','yaoyao','tingting','huihui','female','natural'];
    for(var k=0;k<order.length;k++){for(var j=0;j<zh.length;j++){if(zh[j].name.toLowerCase().indexOf(order[k])>-1)return zh[j];}}
    return zh.length?zh[zh.length-1]:null;
  }catch(e){return null}
}
// 朗读文本清理：跳过 emoji / 装饰符号（📅🏛️①② 等），保留中文标点
function cleanReadText(t){
  return String(t||'')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{2190}-\u{21FF}]/gu,'')
    .replace(/[\u2460-\u24FF\u2160-\u217F]/g,'')
    .replace(/[|·•►▸●○◆■□▪▫—–]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function rdClick(btn,b){
  var text=cleanReadText(b.textContent);
  if(!text){toast('没有可朗读的内容');return}
  if(RD.btn===btn&&RD.state==='playing'){speechSynthesis.cancel();RD.state='stopped';rdMenu(btn,b);return;}
  if(RD.btn===btn&&RD.state==='stopped'){rdMenu(btn,b);return;}
  RD={state:'playing',blocks:splitSent(text),idx:0,btn:btn};
  document.querySelectorAll('.rd-on').forEach(function(x){x.classList.remove('rd-on')});
  btn.classList.add('rd-on');
  playBlock();
}
function playBlock(){
  if(RD.state!=='playing')return;
  var b=RD.blocks[RD.idx];
  if(!b){RD.state='idle';if(RD.btn)RD.btn.classList.remove('rd-on');RD.btn=null;return;}
  var u=new SpeechSynthesisUtterance(b);
  u.lang='zh-CN';u.rate=1.0;
  var v=pickVoice();if(v)u.voice=v;
  u.onend=function(){if(RD.state!=='playing')return;RD.idx++;playBlock();};
  u.onerror=function(){RD.state='idle';if(RD.btn)RD.btn.classList.remove('rd-on')};
  try{speechSynthesis.speak(u)}catch(e){RD.state='idle'}
}
function rdMenu(btn,b){
  var m=document.getElementById('rdmenu');
  if(!m){
    m=document.createElement('div');m.id='rdmenu';
    m.style.cssText='position:fixed;z-index:99999;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:6px;display:none;font-size:14px';
    m.innerHTML='<button data-a="restart" style="display:block;width:100%;border:none;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;text-align:left">🔁 从头播放</button><button data-a="resume" style="display:block;width:100%;border:none;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;text-align:left">⏯ 继续播放</button>';
    m.addEventListener('click',function(e){
      var a=e.target&&e.target.getAttribute&&e.target.getAttribute('data-a');
      if(!a)return;m.style.display='none';
      RD.state='playing';if(RD.btn)RD.btn.classList.add('rd-on');
      if(a==='restart')RD.idx=0;
      playBlock();
    });
    document.body.appendChild(m);
  }
  var r=btn.getBoundingClientRect();
  m.style.display='block';m.style.left=Math.max(4,r.left)+'px';m.style.top=(r.bottom+6)+'px';
}
// 音色选择
btnVoice.addEventListener('click',function(){
  var vs=window.speechSynthesis.getVoices();
  var zh=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf('zh')===0});
  if(!zh.length){toast('没有可用中文语音（浏览器需装中文语音包）');return}
  var cur='';try{cur=localStorage.getItem(VOICE_KEY)||''}catch(e){}
  var m=document.getElementById('vmenu');
  if(!m){
    m=document.createElement('div');m.id='vmenu';
    m.style.cssText='position:fixed;z-index:99999;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:6px;display:none;max-height:60vh;overflow:auto;font-size:13px';
    m.addEventListener('click',function(e){
      var t=e.target&&e.target.getAttribute&&e.target.getAttribute('data-v');
      if(!t)return;
      try{localStorage.setItem(VOICE_KEY,t)}catch(e){}
      m.style.display='none';
      try{speechSynthesis.cancel()}catch(e){}
      toast('音色已切换，试听中…');
      document.querySelectorAll('#vmenu button').forEach(function(x){x.style.background=x.getAttribute('data-v')===t?'#e8f3ec':'transparent'});
      var vs=window.speechSynthesis.getVoices(),vv=null;
      for(var i=0;i<vs.length;i++){if(vs[i].name===t)vv=vs[i];}
      if(vv){
        var pu=new SpeechSynthesisUtterance('欢迎使用古建筑智能导游。这是语音音色试听，喜欢这个声音请直接开始使用。');
        pu.lang='zh-CN';pu.rate=1.0;pu.voice=vv;
        window.__pvOn=true;
        pu.onend=function(){window.__pvOn=false};
        pu.onerror=function(){window.__pvOn=false};
        try{speechSynthesis.speak(pu)}catch(e){window.__pvOn=false}
      }
    });
    document.body.appendChild(m);
  }
  m.innerHTML='';
  zh.forEach(function(v){
    var b=document.createElement('button');
    b.setAttribute('data-v',v.name);
    b.style.cssText='display:block;width:100%;border:none;background:'+(v.name===cur?'#e8f3ec':'transparent')+';padding:7px 12px;border-radius:8px;cursor:pointer;text-align:left';
    b.textContent=v.name+'（'+(v.lang||'')+'）';
    m.appendChild(b);
  });
  var r=btnVoice.getBoundingClientRect();
  m.style.display='block';m.style.left=Math.max(4,r.left)+'px';m.style.top=(r.bottom+6)+'px';
});
document.addEventListener('click',function(e){
  if(window.__pvOn){try{speechSynthesis.cancel()}catch(e3){}window.__pvOn=false}   // 试听期间点击任意处即停止
  ['rdmenu','vmenu'].forEach(function(id){
    var m=document.getElementById(id);
    if(m&&m.style.display==='block'&&!(e.target&&e.target.closest&&e.target.closest('#'+id))){
      m.style.display='none';
      if(id==='vmenu'){try{speechSynthesis.cancel()}catch(e2){}}   // 关闭音色菜单即停止试听
    }
  });
},true);
// 本地历史删除
function histDel(id){var a=histGet().filter(function(x){return x.id!==id});try{localStorage.setItem(HIST,JSON.stringify(a))}catch(e){}}
// 语音输入（浏览器中文识别）
var _micRec=null;
btnMic.addEventListener('click',function(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('当前浏览器不支持语音输入');return;}
  if(_micRec&&_micRec.__on){_micRec.stop();return;}
  var r=new SR();_micRec=r;r.__on=1;
  r.lang='zh-CN';r.interimResults=false;r.maxAlternatives=1;
  r.onresult=function(e){
    var t=e.results[0][0].transcript;
    input.value=(input.value?input.value+' ':'')+t;autoGrow();
    toast('已识别：'+t);
  };
  r.onend=function(){_micRec=null;btnMic.classList.remove('mic-on');if(input.placeholder.indexOf('正在聆听')===0)input.placeholder='打字提问…（可带照片）'};
  r.onerror=function(){_micRec=null;btnMic.classList.remove('mic-on');input.placeholder='打字提问…（可带照片）';toast('语音识别失败，请重试')};
  try{
    r.start();btnMic.classList.add('mic-on');input.placeholder='正在聆听…（请说话）';toast('正在聆听…');
  }catch(e){btnMic.classList.remove('mic-on');input.placeholder='打字提问…（可带照片）'}
});
// 删除模式（勾选框批量删除 / 全部清除）
var selMode=false;
var selToolbar=document.getElementById('selToolbar'),btnSelCancel=document.getElementById('btnSelCancel'),btnSelAll=document.getElementById('btnSelAll'),btnSelRm=document.getElementById('btnSelRm'),btnSelClearAll=document.getElementById('btnSelClearAll');
function refreshSel(){var n=document.querySelectorAll('.msg-cb.on').length;document.getElementById('selN').textContent=n}
function enterSel(){selMode=true;msgs.classList.add('sel');selToolbar.style.display='flex';refreshSel();toast('点勾选框选择，再点删除')}
function exitSel(){selMode=false;msgs.classList.remove('sel');selToolbar.style.display='none';document.querySelectorAll('.msg-cb').forEach(function(x){x.classList.remove('on')});refreshSel()}
btnDel.addEventListener('click',function(){if(selMode)exitSel();else enterSel()});
btnSelCancel.addEventListener('click',exitSel);
btnSelAll.addEventListener('click',function(){
  var cbs=document.querySelectorAll('.msg-cb'),all=document.querySelectorAll('.msg-cb.on').length===cbs.length;
  cbs.forEach(function(x){x.classList.toggle('on',!all)});refreshSel();
});
msgs.addEventListener('click',function(e){
  if(!selMode)return;
  var cb=e.target.closest('.msg-cb');
  if(!cb)return;
  cb.classList.toggle('on');refreshSel();
});
btnSelRm.addEventListener('click',function(){
  var ids=[];
  document.querySelectorAll('.msg-cb.on').forEach(function(cb){
    var w=cb.closest('.msg');if(w)w.remove();
    var h=cb.getAttribute('data-hist');if(h)ids.push(h);
  });
  ids.forEach(function(id){histDel(id)});
  toast('已删除 '+ids.length+' 条');refreshSel();
});
btnSelClearAll.addEventListener('click',function(){
  if(!confirm('确定清除本设备的全部对话？'))return;
  try{localStorage.removeItem(KEY)}catch(e){}
  try{localStorage.removeItem(HIST)}catch(e){}
  location.reload();
});
// 长按气泡进入删除模式（≥600ms，未移动）
var _pd=null;
msgs.addEventListener('pointerdown',function(e){
  if(e.target.closest('.op-btn')||e.target.closest('.msg-cb')){_pd=null;return}
  _pd={t:Date.now(),x:e.clientX,y:e.clientY};
});
msgs.addEventListener('pointerup',function(e){
  if(_pd&&Date.now()-_pd.t>600&&Math.abs(e.clientX-_pd.x)<12&&Math.abs(e.clientY-_pd.y)<12&&!e.target.closest('.op-btn')&&!e.target.closest('.msg-cb')){
    if(!selMode)enterSel();
  }
  _pd=null;
});
function addTyping(){var w=document.createElement('div');w.className='msg assistant';w.id='typing';w.innerHTML='<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';msgs.appendChild(w);msgs.scrollTop=msgs.scrollHeight}
function rmTyping(){var t=document.getElementById('typing');if(t)t.remove()}

function contentToHtml(content){
  if(!content)return '';
  var c=content;
  if(typeof c==='string'){try{c=JSON.parse(c)}catch(e){}}
  if(Array.isArray(c)){return c.map(function(p){if(p.type==='text')return md(p.text||'');if(p.type==='image')return '<img src="'+((p.file_url)||('__img__'+(p.file_id||'')+'__'))+'" alt="图片">';return ''}).join('')}
  return md(String(c));
}
// 图片 file_id → 可显示图（依次尝试 v3/v1 content，失败才提示）
function resolveImgs(root){
  (root||document).querySelectorAll('img[src^="__img__"]').forEach(function(im){
    var fid=im.getAttribute('src').slice(7,-2);
    var urls=[BASE+'/v3/files/'+encodeURIComponent(fid)+'/content',BASE+'/v1/files/'+encodeURIComponent(fid)+'/content'];
    (function tryNext(i){
      if(i>=urls.length){im.outerHTML='<i>（图片加载失败）</i>';return}
      fetch(urls[i],{headers:{'Authorization':'Bearer '+PAT}})
        .then(function(r){if(!r.ok)throw 0;return r.blob()})
        .then(function(b){im.src=URL.createObjectURL(b)})
        .catch(function(){tryNext(i+1)});
    })(0);
  });
}
// 左下角状态角标（测试期诊断用，确认后移除；点击可复制）
var diagEl=document.createElement('div');
diagEl.id='diagbar';
diagEl.style.cssText='position:fixed;left:4px;bottom:4px;z-index:9999;background:rgba(0,0,0,.55);color:#fff;font:11px monospace;padding:3px 8px;border-radius:4px;max-width:92vw;user-select:text;-webkit-user-select:text;cursor:pointer';
diagEl.title='点击复制诊断信息';
diagEl.addEventListener('click',function(){try{navigator.clipboard.writeText(diagEl.textContent).then(function(){toast('已复制诊断信息')},function(){})}catch(e){}});
document.body.appendChild(diagEl);
function diag(s){diagEl.textContent=s}
// 加载本设备历史（带页面内诊断）
function loadHistory(){
  // 先渲染本设备本地历史（顺序=真实对话顺序，完整讲解与图片不丢）
  histGet().forEach(function(it){
    var html='';
    if(it.t)html=md(it.t);
    if(it.img)html+='<img src="'+it.img+'" alt="图片">';
    if(!html)html='<i>（图片）</i>';
    addMsg(it.r==='u'?'user':'assistant',html,it.id);
  });
  var conv=getConv();
  if(!conv){diag('无本设备会话 → 显示开场白（本地历史已显示）');showOnboarding();return;}
  diag('历史请求中… conv='+String(conv).slice(0,12));
  var done=false;
  function fin(reason){
    if(done)return;done=true;
    if(reason==='timeout'){diag('超时：历史接口未响应');toast('历史加载超时：接口未响应（已按新对话显示）')}
    resolveImgs();showOnboarding();
  }
  setTimeout(function(){fin('timeout')},8000);
  fetch(BASE+'/v1/conversation/message/list?conversation_id='+encodeURIComponent(conv),{method:'POST',headers:{'Authorization':'Bearer '+PAT,'Content-Type':'application/json'},body:'{}'})
    .then(function(r){return r.json()})
    .then(function(j){
      if(j.code!==0){
        diag('历史失败 code='+j.code+' '+(j.msg||'')+'（保留会话，重试）');
        toast('历史加载失败：'+(j.msg||'错误')+'（会话保留，可重试）');
      } else {
        var arr=(j&&j.data||[]).slice().sort(function(a,b){return String(a.created_at||'').localeCompare(String(b.created_at||''))});
        var rendered=0;
        if(histGet().length===0){   // 有本地历史则以本地顺序为准；无本地才用服务端
          arr.forEach(function(m){
            var role=m.role||'',type=m.type||'';
            if(role!=='user'&&role!=='assistant')return;
            if(type==='function_call'||type==='function_response'||type==='tool_response')return;
            var who=(role==='user')?'user':'assistant';
            var html=contentToHtml(m.content);
            if(html){addMsg(who,html);rendered++;}
          });
        } else {
          rendered=arr.length;   // 已用本地历史，服务端仅计条数
        }
        diag('历史 code=0 条数='+arr.length+' 渲染='+rendered+' ['+arr.map(function(m){return (m.role||'?')+':'+(m.type||'?')}).join(',')+']');
        if(arr.length===0){toast('本会话暂无历史消息')}
      }
      fin();
    })
    .catch(function(e){diag('历史异常: '+(e&&e.message?e.message:'网络错误')+'（保留会话）');toast('历史加载异常：'+(e&&e.message?e.message:'网络错误')+'（会话保留，可重试）');fin()});
}
// 首次（无历史）显示 Bot 开场白 + 推荐问题
function showOnboarding(){
  if(msgs.children.length>0)return;   // 已有历史不重复显示
  fetch(BASE+'/v1/bots/'+BOT,{headers:{'Authorization':'Bearer '+PAT}})
    .then(function(r){return r.json()})
    .then(function(j){
      var o=j&&j.data&&j.data.onboarding_info;
      if(!o||!o.prologue)return;
      addMsg('assistant',md(o.prologue));
      var qs=o.suggested_questions||[];
      if(qs.length){
        var w=document.createElement('div');w.className='msg assistant';
        qs.forEach(function(q){
          var b=document.createElement('button');
          b.textContent=q;
          b.style.cssText='display:block;margin:5px 0 0;background:#fff;border:1px solid #1e6f50;color:#1e6f50;border-radius:14px;padding:9px 14px;font-size:15px;cursor:pointer;text-align:left';
          b.addEventListener('click',function(){input.value=q;send()});
          w.appendChild(b);
        });
        msgs.appendChild(w);msgs.scrollTop=msgs.scrollHeight;
      }
    })
    .catch(function(){});
}
// 上传图片 → file_id
function uploadImg(b64,mime){
  var bytes=atob(b64);var buf=new Uint8Array(bytes.length);
  for(var i=0;i<bytes.length;i++)buf[i]=bytes.charCodeAt(i);
  var fd=new FormData();
  fd.append('file',new Blob([buf],{type:mime}),'pic.'+(mime.split('/')[1]||'png').replace('jpeg','jpg'));
  return fetch(BASE+'/v1/files/upload',{method:'POST',headers:{'Authorization':'Bearer '+PAT},body:fd})
    .then(function(r){return r.json()})
    .then(function(j){if(j.code!==0||!j.data||!j.data.id)throw new Error('图片上传失败: '+(j.msg||''));return j.data.id});
}
// 图片压缩（宽≤800 的 JPEG，用于本地历史缓存，控制容量）
function compressImg(dataUrl){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){
      try{
        var max=800,scale=1;
        if(im.width>max||im.height>max)scale=max/Math.max(im.width,im.height);
        var cv=document.createElement('canvas');cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',0.8));
      }catch(e){res('')}
    };
    im.onerror=function(){res('')};
    im.src=dataUrl;
  });
}
function send(){
  if(sending)return;
  var text=input.value.trim();
  if(!text&&pendingImg===null)return;
  input.value='';autoGrow();
  var imgToSend=pendingImg,mimeToSend=pendingMime;
  clearPreview();
  // 用户气泡（图片立即显示，文本随后由回复流程展示——直接先显示）
  var uh='';
  if(imgToSend!==null)uh+='<img src="data:'+mimeToSend+';base64,'+imgToSend+'">';
  if(text)uh+=(imgToSend!==null?'<br>':'')+md(text);
  var hIdU='h'+Date.now()+'_'+Math.floor(Math.random()*9999);
  addMsg('user',uh||'<i>（图片）</i>',hIdU);
  histPush({r:'u',t:text||'',img:pendingImgSmall||'',id:hIdU,ts:Date.now()});
  addTyping();sending=true;sendBtn.disabled=true;
  // 组装消息：有图先上传拿 file_id
  var uploadP=imgToSend!==null?uploadImg(imgToSend,mimeToSend):Promise.resolve(null);
  uploadP.then(function(fid){
    var parts=[];
    if(fid)parts.push({type:'image',file_id:fid});
    if(text)parts.push({type:'text',text:text});
    var conv=getConv();
    var body={bot_id:BOT,user_id:did(),stream:false,additional_messages:[{role:'user',content_type:parts.length? 'object_string':'text',content:parts.length? JSON.stringify(parts):text}]};
    if(conv)body.conversation_id=conv;   // 有本设备会话则续用，无则让服务端创建
    return fetch(BASE+'/v3/chat',{method:'POST',headers:{'Authorization':'Bearer '+PAT,'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json()})
      .then(function(j){
        if(j.code!==0||!j.data){throw new Error((j.msg||'chat 创建失败')+(j.code===4002?'：请检查 PAT':''));}
        if(!getConv()&&j.data.conversation_id){setConv(j.data.conversation_id);toast('已为本设备建立独立会话')}   // 首次：记住本设备会话
        return poll(j.data.conversation_id,j.data.id);
      });
  })
  .then(function(reply){
    rmTyping();
    var hIdA='h'+Date.now()+'_'+Math.floor(Math.random()*9999);
    addMsg('assistant',contentToHtml(reply),hIdA);resolveImgs();
    var ex=extractReply(reply);histPush({r:'a',t:ex.text,img:ex.img,id:hIdA,ts:Date.now()});
    sending=false;sendBtn.disabled=false;
  })
  .catch(function(e){
    rmTyping();addMsg('assistant','⚠️ '+esc(e&&e.message?e.message:String(e)));
    sending=false;sendBtn.disabled=false;
  });
}
function poll(cid,chid){
  return new Promise(function(resolve,reject){
    var t0=Date.now();
    (function step(){
      fetch(BASE+'/v3/chat/retrieve?conversation_id='+encodeURIComponent(cid)+'&chat_id='+encodeURIComponent(chid),{headers:{'Authorization':'Bearer '+PAT}})
        .then(function(r){return r.json()})
        .then(function(j){
          var st=j&&j.data&&j.data.status;
          if(st==='completed')return resolve(fetchReply(cid,chid));
          if(st==='failed')return reject(new Error('对话运行失败'));
          if(Date.now()-t0>150000)return reject(new Error('对话超时，请重试'));
          setTimeout(step,2000);
        })
        .catch(function(e){reject(e)});
    })();
  });
}
function fetchReply(cid,chid){
  return fetch(BASE+'/v3/chat/message/list?conversation_id='+encodeURIComponent(cid)+'&chat_id='+encodeURIComponent(chid),{headers:{'Authorization':'Bearer '+PAT}})
    .then(function(r){return r.json()})
    .then(function(j){
      var arr=j&&j.data||[];
      var ans=[].concat(arr).reverse().find(function(m){return m&&m.type==='answer'&&m.role==='assistant'});
      return ans?ans.content:'（无回复）';
    });
}
// 图片选择与预览
elFile.addEventListener('change',function(){
  var f=elFile.files[0];if(!f)return;
  if(!/^image\//.test(f.type)){toast('请选择图片');elFile.value='';return}
  var rd=new FileReader();
  rd.onload=function(){
    var d=rd.result,semi=d.indexOf(';');
    pendingMime=d.slice(5,semi);pendingImg=d.slice(d.indexOf(',')+1);
    elPrevImg.src=d;elPreview.hidden=false;
  };
  rd.readAsDataURL(f);elFile.value='';
});
elPrevRemove.addEventListener('click',clearPreview);
elPrevConfirm.addEventListener('click',function(){
  elPreview.hidden=true;
  pendingImgSmall='';
  var d='data:'+pendingMime+';base64,'+pendingImg;
  compressImg(d).then(function(s){pendingImgSmall=s;send()}).catch(function(){send()});
});
function clearPreview(){pendingImg=null;pendingMime=null;elPreview.hidden=true;elPrevImg.src=''}
function autoGrow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px'}
sendBtn.addEventListener('click',send);
input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
input.addEventListener('input',autoGrow);
loadHistory();
</script>
